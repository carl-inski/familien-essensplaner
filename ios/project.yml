# Xcode-Projekt als Text. Nach jeder Änderung: ios/scripts/bootstrap.sh
# (erzeugt Gnocchi.xcodeproj neu; die .xcodeproj-Datei selbst ist nicht im Repo).
name: Gnocchi
options:
  # Vor dem App Store auf eine eigene, umgekehrte Domain ändern
  bundleIdPrefix: app.gnocchi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Eigenes Apple-Entwicklerteam eintragen (Xcode → Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GnocchiCore:
    path: Packages/GnocchiCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
targets:
  Gnocchi:
    type: application
    platform: iOS
    sources:
      - path: Gnocchi
    dependencies:
      - package: GnocchiCore
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gnocchi.ios
        PRODUCT_NAME: Gnocchi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gnocchi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  GnocchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GnocchiTests
    dependencies:
      - target: Gnocchi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gnocchi:
    build:
      targets:
        Gnocchi: all
    test:
      targets:
        - GnocchiTests
